<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>404 — Unknown host</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root { --bg: #000; --fg: #e0e0e0; --dim: #777; }

  ::selection { background: var(--fg); color: var(--bg); }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }

  .wrap {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  .topbar {
    flex-shrink: 0;
    padding: 6px 16px;
    font-size: 12px;
    color: var(--dim);
    border-bottom: 1px solid #1a1a1a;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0a0a0a;
  }

  .topbar a { color: var(--dim); text-decoration: none; transition: color 0.15s; }
  .topbar a:hover { color: var(--fg); }

  .body { flex: 1; overflow-y: auto; padding: 20px; }

  .response { white-space: pre-wrap; word-break: break-word; }

  .dim { color: var(--dim); }

  .back {
    color: var(--fg);
    text-decoration: none;
    display: inline-block;
    padding: 5px 0;
  }

  .back:hover { text-decoration: underline; }

  @media (max-width: 600px) {
    html, body { font-size: 13px; }
    .body { padding: 10px; }
    .topbar { padding: 6px 10px; font-size: 11px; }
  }

  @media (max-width: 360px) {
    html, body { font-size: 12px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <span>jjonasson.dev</span>
    <a href="/">&lt;- home</a>
  </div>
  <div class="body">
    <div class="response" id="out"></div>
    <a class="back" href="/">&lt;- return to jjonasson.dev</a>
  </div>
</div>

<script>
// Keep the ping line inside the 36-column budget the rest of the site uses.
var narrow = window.matchMedia('(max-width: 600px)').matches;
var path = location.pathname.replace(/[<>&]/g, '').slice(0, narrow ? 18 : 40) || '/';

document.getElementById('out').textContent =
  '\n' +
  'jakob@portfolio# ping ' + path + '\n\n' +
  'Translating "' + path + '"...domain server (8.8.8.8)\n\n' +
  '% Unknown command or computer name, or unable to find\n' +
  '  computer address\n\n' +
  'Success rate is 0 percent (0/5)\n\n' +
  'HTTP 404 - that route is not in the table.\n';
</script>

</body>
</html>
